      - run:
          name: Extract Bundle ID
          command: |
            cd /Users/distiller/project/ios
            echo "----------------------------------------"
            echo "📍 Checking build settings for Bundle ID:"
            
            # Extract Bundle ID using xcodebuild with improved parsing
            BUNDLE_ID=$(xcodebuild -showBuildSettings -configuration Release | grep "PRODUCT_BUNDLE_IDENTIFIER" | sed -n 's/[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER = //p' | tr -d '[:space:]')
            
            # Validate the Bundle ID
            if [ -z "$BUNDLE_ID" ] || [[ "$BUNDLE_ID" == *"$"* ]] || [ "$BUNDLE_ID" = "NO" ]; then
              echo "❌ ERROR: Could not extract valid Bundle ID"
              exit 1
            fi
            
            echo "✅ Successfully extracted Bundle ID: ${BUNDLE_ID}"
            echo "----------------------------------------"
            
            echo "export BUNDLE_ID='${BUNDLE_ID}'" >> $BASH_ENV
            source $BASH_ENV


